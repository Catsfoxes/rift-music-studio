<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Rift Music Studio — a browser-based music playground.">
  <title>Rift Music Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">🎵</div>
        <div>
          <h1>Rift Music Studio</h1>
          <p class="subtitle">Build sounds. Stack ideas. Make a little magic.</p>
        </div>
      </div>
      <div class="toolbar">
        <button id="addTrackButton" class="primary">＋ Add Track</button>
        <button id="clearButton" class="danger">Clear</button>
        <input id="audioFile" type="file" accept="audio/*" multiple hidden>
      </div>
    </header>

    <main class="studio">
      <section class="panel">
        <div class="panel-head">
          <div>
            <strong>Timeline</strong>
            <div id="trackCount" class="meta">0 tracks</div>
          </div>
          <div class="transport">
            <span id="transport" class="transport-status">Ready</span>
            <button id="playButton" class="primary">Play</button>
            <button id="stopButton">Stop</button>
          </div>
        </div>

        <div class="timeline">
          <div id="tracks"></div>
          <div id="emptyState" class="empty">
            <strong>Your studio is empty.</strong>
            Add an audio file to create your first track.
          </div>
        </div>
      </section>

      <section class="panel settings">
        <div class="setting">
          <div class="setting-title"><span>Tempo</span><strong><span id="bpmValue">120</span> BPM</strong></div>
          <input id="bpm" type="range" min="40" max="240" value="120" step="1">
        </div>
        <div class="setting">
          <div class="setting-title"><span>Master volume</span><strong id="masterValue">90%</strong></div>
          <input id="masterVolume" type="range" min="0" max="1" value="0.9" step="0.01">
        </div>
      </section>
    </main>

    <p class="footer-note">Prototype 0.2 — audio tracks are loaded locally in your browser; files are not uploaded.</p>
  </div>
  <script src="app.js"></script>
</body>
</html>
